name = "gambit-record-broker"
main = "src/index.ts"
compatibility_date = "2026-08-31"

[vars]
CHANNEL_TITLE = "Gambit Record"
MAX_CHUNK_BYTES = "8388608"
MAX_VIDEO_BYTES = "4294967296"
MAX_UPLOADS_PER_IP_DAY = "10"
MAX_UPLOADS_GLOBAL_DAY = "90"

[[durable_objects.bindings]]
name = "UPLOADS"
class_name = "UploadSession"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "DailyLimiter"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["UploadSession", "DailyLimiter"]
