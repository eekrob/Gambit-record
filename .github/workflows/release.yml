name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - uses: lukka/run-vcpkg@v11
      - name: Build worker
        shell: pwsh
        env:
          GRECORD_RELEASE_KEY: ${{ secrets.GRECORD_BROKER_KEY }}
        run: |
          cmake --preset worker-ci -DGRECORD_BROKER_KEY="$env:GRECORD_RELEASE_KEY"
          cmake --build --preset worker-ci
          ctest --preset worker-ci
      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW32
          update: true
          install: mingw-w64-i686-gcc mingw-w64-i686-cmake mingw-w64-i686-ninja git
      - name: Build ASI
        shell: msys2 {0}
        run: |
          cmake -S grecord -B build-asi -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          cmake --build build-asi --parallel
          if objdump -p build-asi/grecord.asi | grep -Eiq 'DLL Name: (libgcc|libstdc\+\+|libwinpthread)'; then
            echo 'grecord.asi depends on a MinGW runtime DLL' >&2
            objdump -p build-asi/grecord.asi | grep -i 'DLL Name:' >&2
            exit 1
          fi
      - name: Package release archive and checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $package = './dist/G-Record'
          New-Item -ItemType Directory -Force -Path "$package/grecord/licenses" | Out-Null
          Copy-Item ./build-asi/grecord.asi "$package/grecord.asi"
          Copy-Item ./build/bin/GambitRecord.exe "$package/GambitRecord.exe"
          Copy-Item ./config.example.json "$package/grecord/config.json"
          Copy-Item ./LICENSE "$package/grecord/licenses/LICENSE"
          Copy-Item ./THIRD_PARTY_NOTICES.md "$package/grecord/licenses/THIRD_PARTY_NOTICES.md"
          Copy-Item ./grecord/resources/OFL-NotoSans.txt "$package/grecord/licenses/OFL-NotoSans.txt"
          Copy-Item ./grecord/resources/CC-BY-4.0-Coolicons.txt "$package/grecord/licenses/CC-BY-4.0-Coolicons.txt"
          Compress-Archive -Path $package -DestinationPath ./dist/G-Record.zip -Force
          Remove-Item -LiteralPath $package -Recurse -Force
          Get-FileHash ./dist/G-Record.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  G-Record.zip" } | Set-Content ./dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: dist/*
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
